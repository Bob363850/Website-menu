<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cinzel:wght@700&family=Great+Vibes&family=Happy+Monkey&display=swap" rel="stylesheet">
    <!-- 1. LINK YOUR CSS HERE -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="top-banner">
        <!-- LEFT SHIELD -->
        <img src="shield.png" alt="Shield and Axes" class="banner-crest">
    
        <!-- MIDDLE TEXT (Updated name, no subtitle) -->
        <div class="banner-text">
            <h1 class="banner-title skyrim-theme">The Danworth Arms</h1>
        </div>
    
        <!-- RIGHT SHIELD -->
        <img src="shield.png" alt="Shield and Axes" class="banner-crest">
    </header>


    <main class="content-area">
        <br>
        <p class="skyrim-theme">If you are vegan, check the box here: </p>
        <input type="checkbox" class="page-linker" data-target="vegan_menu.html">
        <br>
        <p class="skyrim-theme">If you are a vegetarian, check the box here: </p>
        <input type="checkbox" class="page-linker" data-target="veggy_menu.html">
        <br>
        <p class="skyrim-theme">If you are gluten free, check the box here: </p>
        <input type="checkbox" class="page-linker" data-target="gluten_free_menu.html">
        <br>
        <p class="skyrim-theme">If you are non of the above, check the box here: </p>
        <input type="checkbox" class="page-linker" data-target="menu.html">
        <br>
        <p class="small-text skyrim-theme">For any other allergies or preferences, talk to the staff when or before ordering</p>
        <div class="food-image-container">
            <img src="white_baked_salmon.png" alt="White Baked Salmon" class="food-image">
        </div>
    </main>
    <!-- 2. LINK YOUR JAVASCRIPT HERE -->
    <script src="app.js"></script>
</body>
</html>
